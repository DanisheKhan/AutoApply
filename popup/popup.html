<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoApply Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z" fill="url(#popup-sp-grad)" />
            <defs>
              <linearGradient id="popup-sp-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FFFFFF" />
                <stop offset="1" stop-color="#94A3B8" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-info">
          <div class="brand-title-wrap">
            <span class="brand-title">AutoApply</span>
            <span class="badge-pro">PRO</span>
          </div>
          <span class="brand-subtitle">Mohammad Danish Khan</span>
        </div>
      </div>

      <label class="floating-toggle-pill" id="floating-toggle-pill" title="Floating Button: Active (Click to deactivate)">
        <span class="pulse-dot" id="widget-status-dot"></span>
        <span class="status-text" id="widget-status-text">Active</span>
        <input type="checkbox" id="widget-toggle" checked />
        <span class="toggle-slider"></span>
      </label>
    </header>

    <!-- Context Strip (Streamlined & Minimal) -->
    <div class="platform-strip">
      <div class="platform-strip-left">
        <span class="platform-live-dot" id="platform-live-dot"></span>
        <span class="platform-name" id="detected-platform">Scanning page...</span>
      </div>
      <span class="badge-tag standby" id="platform-tag">STANDBY</span>
    </div>

    <!-- Actions -->
    <div class="actions-group">
      <!-- Primary Hero Action: 1-Click Autofill -->
      <button class="btn btn-hero" id="btn-autofill" title="Autofill active application">
        <div class="hero-content">
          <div class="hero-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
          </div>
          <div class="hero-text">
            <strong>1-Click Autofill</strong>
            <small>Fill all fields, marks & resume</small>
          </div>
        </div>
        <kbd class="key-shortcut">Alt+Shift+F</kbd>
      </button>

      <!-- Secondary Commands (Unified Minimalist Menu) -->
      <div class="commands-menu">
        <button class="menu-item" id="btn-snip-fill" title="Snip and fill selected area">
          <div class="menu-icon icon-snip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/>
            </svg>
          </div>
          <div class="menu-text">
            <strong>Snip & Fill Area</strong>
            <small>Drag box to fill specific section</small>
          </div>
          <kbd class="key-shortcut shortcut-subtle">Alt+Shift+S</kbd>
        </button>

        <button class="menu-item" id="btn-visual-snip" title="Visual AI multimodal snip">
          <div class="menu-icon icon-visual">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </div>
          <div class="menu-text">
            <strong>Visual AI Snip</strong>
            <small>Screen snip via Gemini Vision</small>
          </div>
          <kbd class="key-shortcut shortcut-subtle">Alt+X</kbd>
        </button>

        <button class="menu-item" id="btn-ai-fill" title="Generate AI essay answers">
          <div class="menu-icon icon-ai">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z"/>
            </svg>
          </div>
          <div class="menu-text">
            <strong>AI Question Solver</strong>
            <small>Answer essay prompts with Gemini</small>
          </div>
          <span class="menu-chevron">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </span>
        </button>

        <button class="menu-item" id="btn-upload-resume" title="Upload master resume PDF">
          <div class="menu-icon icon-resume">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <div class="menu-text">
            <strong>Upload Resume PDF</strong>
            <small>Attach DanishKhan_Resume.pdf</small>
          </div>
          <span class="menu-chevron">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </span>
        </button>
      </div>
    </div>

    <!-- Status Message (Clean & Ambient) -->
    <div class="status-message" id="status-message">
      Ready to autofill on this page
    </div>

    <!-- Footer Links (Ghost Toolbar) -->
    <footer class="footer">
      <button class="link-btn" id="btn-open-options">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Master Bio & Settings</span>
      </button>
      <div class="footer-dot">•</div>
      <button class="link-btn" id="btn-open-tests">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        <span>Test Suite</span>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
